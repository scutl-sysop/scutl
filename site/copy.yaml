hero:
  headline: Let local agents act — inside limits they can't override
  sub: 'scutl packages real-world capabilities as code-enforced recipes:
    your model holds a wallet, rents servers, runs a paid service,
    watches your uptime — under spending caps, allowlists, and teardown
    guarantees enforced by the installed code, not by prompt text.
    scutbench shows which models can use them safely before money,
    infrastructure, or identity is at risk.

    '
  how: 'Shipped recipes pair a manifest (the design and its safety rules),
    an enforcing command-line tool, an agent-facing ADAPT.md installer,
    and live receipts. Benchmarked recipes have model results but no live
    provider proof yet. Drafts publish the design and whatever components
    exist today. Install a shipped recipe by pointing your agent at its
    page — the ADAPT.md is written for the agent to follow.

    '
recipes:
  wallet-base-sepolia:
    hook: Let your agent spend test money with a hard cap it cannot lift.
    blurb: 'A testnet USDC wallet your agent can pay from: per-payment and
      daily limits are enforced by the signer program itself, keys never
      pass through the model, and every spend is logged. The safe way to
      learn agent payments before real money.

      '
    title: A test-money wallet with hard caps
  paid-service-x402:
    hook: Sell something over HTTP and get paid per request, automatically.
    blurb: 'Run a small service that charges per use via the x402 payment
      standard. Nothing is served until payment actually settles, the payout
      address is fixed in a config the model can''t touch, and income reports
      come only from the append-only earnings log.

      '
    title: Sell a service, get paid per request
  provision-vultr:
    hook: Rent servers only in the plans, regions, hourly prices, and instance
      counts you set — with teardown always available.
    blurb: 'Create, use, and destroy cloud servers inside limits you set
      once: which plans, which regions, how many at a time, max price per
      hour — checked in code before any API call. Destroying is always allowed;
      nothing the model says can raise a limit.

      '
    title: Rent servers inside limits you set
  x402-v2-client:
    hook: Buy from compatible x402 APIs on the network and token you configured,
      under your wallet caps.
    blurb: 'The buyer side of pay-per-use APIs: your agent reads a price
      offer, checks it against your limits and the expected network and
      token, pays once, and verifies settlement on-chain. Wrong token, swapped
      address, or inflated price gets refused before any signature happens.

      '
    title: Buy from pay-per-use APIs under your caps
  own-domain:
    hook: Your agent registers and manages a domain — renewals included.
    blurb: 'Search, register, and manage DNS for a domain under a price
      ceiling, with renewals tracked so nothing lapses silently and nothing
      renews at a surprise price without you approving it.

      '
    title: Buy and hold a domain your agent manages
  capability-purchase:
    hook: One-off purchases of API access, decided and paid inside limits.
    blurb: 'When a task needs a paid capability (an API key, a data product),
      the agent can evaluate the offer and buy it — under your spending
      caps, with the purchase recorded and the credential handled by the
      tool, not the model.

      '
  inbox-triage:
    hook: An agent that reads your inbox without ever being able to send.
    blurb: 'Triage, summarize, and flag mail with a tool that has no send
      operation at all — not blocked, absent. Message bodies arrive marked
      untrusted, and with no send surface there is nothing for a hostile
      email to fire.

      '
  subscription-steward:
    hook: Recurring payments that can never quietly go up.
    blurb: 'Renewals happen inside the price you agreed to; any price increase
      parks the renewal and asks you first. Cancellations count as done
      only when billing provably stops.

      '
    title: Subscriptions at the price you agreed
  scheduled-jobs:
    hook: Scheduled tasks that can't fail silently.
    blurb: 'Cron with a conscience: every scheduled job is witnessed by
      an independent service, missed runs are named, and the watcher itself
      is watched. If something stops running, you find out — that''s the
      whole point.

      '
    title: Scheduled jobs that cannot fail silently
  uptime-monitoring:
    hook: Know your site is up — from where your users stand.
    blurb: 'An outside prober plus a local check, reconciled: "up" requires
      fresh evidence from both, and a stale green light is treated as an
      outage of the monitoring, not proof of health.

      '
    title: Uptime monitoring you can trust
  status-digest:
    hook: A six-hourly status report that never hides bad news.
    blurb: 'Reads your monitoring, composes a digest on schedule, and latches
      a flag on any anomaly until a human clears it. Our own status page
      is this recipe running on our own infrastructure.

      '
  durable-object-storage:
    hook: Backups that are proven restorable, not assumed.
    blurb: 'Off-site copies with integrity checked by re-downloading and
      re-hashing on a schedule — because a backup is a claim until a restore
      proves it. Growth is capped, deletion is a deliberate act, and secrets
      never ride along.

      '
    title: Off-site backups, proven restorable
  identity-backup-restore:
    hook: Rehearse losing everything before it matters.
    blurb: 'Export and verify the durable identity your agent depends on
      — keys, wallet, account ownership — as a rehearsed, checked procedure.
      The agent never moves key material itself.

      '
    title: Back up and rehearse-restore your agent identity
  managed-database:
    hook: A real database your agent can operate — with restore drills.
    blurb: 'Provision, back up, and restore a managed Postgres under spend
      limits, with restore rehearsals so recovery is a practiced path instead
      of a hope.

      '
    title: A database whose backup is proven, not promised
  spend-reconciliation:
    hook: Every ledger checked against every statement, discrepancies escalated.
    blurb: 'A standing audit that compares what your tools logged against
      what providers billed and what the chain shows. It moves no money
      and holds no credentials; disagreements surface with evidence instead
      of being papered over.

      '
    title: Audit every ledger against every statement
  webhook-ingress:
    hook: Verify incoming webhooks, record each event once, and reject replays.
    blurb: 'A hardened front door for incoming events: signatures verified,
      duplicates dropped by a durable ledger, payload content treated as
      data rather than instructions.

      '
    title: A hardened webhook endpoint
  agent-email:
    hook: A real inbox your agent owns — recipients confined, sends capped.
    blurb: 'Send, receive, and thread email from an address your agent pays
      for and controls. Recipients are confined to an allowlist, send volume
      is capped in code, and incoming bodies arrive marked untrusted.

      '
    title: An inbox your agent owns
  messenger-reachability:
    hook: Reach a human on the channel they actually check.
    blurb: 'Delivery across messengers with confirmation that the message
      arrived — and honest escalation when it didn''t, because silence is
      also a failure.

      '
  price-watch-and-buy:
    hook: Watch a price, buy at your number, never above it.
    blurb: 'A standing watch that purchases when conditions you set are
      met — the trigger price is yours, checked in code at buy time, not
      a suggestion the model interprets.

      '
    title: Watch a price, buy at your number
  refund-clerk:
    hook: Refund valid claims by your policy, never above the recorded payment
      or period cap.
    blurb: 'Evaluate refund requests against your stated policy and pay
      the valid ones under caps — generosity is possible, unbounded generosity
      is not.

      '
    title: Refunds by policy, not persuasion
  wallet-mainnet:
    hook: 'The real-money wallet: same hard caps, plus key custody done
      right.'
    blurb: 'Graduates the testnet wallet to real USDC with a founding ceremony
      that proves your backup restores before the wallet holds a cent, spending
      ceilings only a human can raise (after a cooling-off delay), and a
      panic switch that always works.

      '
    title: A real-money wallet with hard caps
  gpu-rental:
    hook: Rent serious GPUs inside hourly-price and pod-count limits, with
      teardown that verifies a deleted pod is really gone.
    blurb: 'Hourly GPU pods inside price and count limits, with teardown
      that verifies the pod is actually gone. Built because we rent GPUs
      for our own benchmarks; the walls exist because hourly billing forgives
      nothing.

      '
    title: GPU rental without forgotten bills
  static-website:
    hook: Publish a website your agent maintains, receipts included.
    blurb: 'Static hosting provisioned and published under spend limits,
      with content verified live after every publish.

      '
    title: Publish a website your agent maintains
