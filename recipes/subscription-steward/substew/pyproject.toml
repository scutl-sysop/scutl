[project]
name = "scutl-renew"
version = "0.1.0"
description = "scutl recipe component: subscription-steward (keep a subscription at the consented price vs an adversarial merchant)"
requires-python = ">=3.10"

[project.scripts]
substew = "scutl_renew.cli:main"
substew-approve = "scutl_renew.cli:approve_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scutl_renew*"]
