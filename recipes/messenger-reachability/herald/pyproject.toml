[project]
name = "scutl-herald"
version = "0.1.0"
description = "scutl recipe component: messenger-reachability (one verified peer, send caps in code)"
requires-python = ">=3.10"

[project.scripts]
herald = "scutl_herald.cli:main"
herald-approve = "scutl_herald.cli:approve_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scutl_herald*"]
