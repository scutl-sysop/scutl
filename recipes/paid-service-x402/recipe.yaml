# SCUTL recipe manifest — rev 4: environment-correct public-tls verify commands
# Recipe #2: "Expose a paid service"
# Design records: bead cst-8ih.5 (rev 1 rulings), cst-8ih.7 (rev 2 rulings,
# 2026-08-13), cst-8ih.9 (rev 3 reword ruling, 2026-08-14), epic cst-8ih.
# Rev 3 delta: human-actored setup steps in the smol bundle render as
# verify-then-proceed (scutl 2faa349) instead of stop-and-ask.
# Rev 4 delta (cst-8ih.13): dns-record/install-proxy verify commands are
# environment-correct — getent instead of dig, curl-only ingress proof
# instead of systemctl for a service that may live on another host.
#
# What this recipe stresses that wallet rev 1 did not (the reason it exists):
#   1. long-lived Execute — a running service with a lifecycle, not discrete calls
#   2. inbound money — verify-then-serve; settlement of payments RECEIVED
#   3. real Decide branching — first tree with more than one blessed leaf
#   4. composition — the acceptance buyer IS the wallet recipe (first registry edge)

recipe:
  id: paid-service
  rev: 4
  title: "Expose a paid service"
  summary: >
    Stand up an agent-operated HTTP service that sells a resource over x402:
    price advertised via 402 offers, payment verified and settled through the
    facilitator BEFORE the resource is served, earnings recorded in an
    append-only log. The merchant holds no private key — it only names a
    receiving address, fixed at setup. Rev 2 adds a public-tls exposure
    leaf: a Caddy reverse proxy terminates TLS as the only public listener;
    the merchant daemon stays on loopback and still holds no key material.
  status: shipped  # receipts: receipts/paid-service/ (status field was stale vs the shipped catalog row — caught by the site generator, cst-j01t)
  maintainer: first-party
  depends:
    # Composition edge: acceptance tests drive a buyer installed from the
    # wallet recipe. The merchant recipe itself needs no wallet.
    - { recipe: wallet, rev: 1, role: acceptance-buyer }

# ---------------------------------------------------------------------------
# DECIDE — first tree where a question has MORE THAN ONE blessed leaf; every
# blessed leaf is exercised by the slice ladder before this ships.
# ---------------------------------------------------------------------------
decide:
  - id: offering
    question: "What does the service sell?"
    options:
      - id: static-file
        label: "A static resource (file served verbatim per paid request)"
        blessed: true
        asks: [resource_path]
      - id: generated-text
        label: "Deterministic generated text (template endpoint, e.g. haiku-of-the-day)"
        blessed: true
    deferred-options: [model-inference, proxy-upstream-api]

  - id: pricing
    question: "How is the resource priced?"
    options:
      - id: flat-per-request
        label: "Flat price per request (only option in rev 1)"
        blessed: true
        asks: [price_usdc]
    deferred-options: [metered, tiered]

  - id: exposure
    question: "Who can reach the service?"
    options:
      - id: lan-plaintext
        label: "Bind a local/LAN address and port; buyer is on the same network (rev 1 behavior, carried forward)"
        blessed: true
        asks: [bind_addr, bind_port]
      - id: public-tls
        label: "Public HTTPS behind a Caddy reverse proxy; merchant daemon stays on loopback"
        blessed: true
        asks: [public_hostname, bind_port]
    # public-ip stays deferred: ACME will not issue for bare IPs, and a
    # self-signed leaf trains the acceptance buyer to skip TLS verification.
    deferred-options: [public-tunnel, public-ip]

parameters:
  payto_address:
    type: eth-address
    prompt: "Receiving address for settled payments (fixed at setup; changing it is a human-approved admin op)"
  price_usdc:
    type: decimal-usdc
    prompt: "Flat price per request"
    default: "0.01"
  resource_path:
    type: path
    prompt: "File to serve (offering: static-file)"
  bind_addr:
    type: ip-address
    default: "127.0.0.1"
  bind_port:
    type: port
    default: "8402"
  public_hostname:
    type: fqdn
    prompt: "Public FQDN for the service (exposure: public-tls); a subdomain
             the human points at this host BEFORE setup continues"

# ---------------------------------------------------------------------------
# COMPONENTS — the merchant daemon is the guardrail: verify-before-serve and
# the fixed payTo live in code, not in prompts.
# ---------------------------------------------------------------------------
components:
  pserv:
    kind: typed-tool + service   # typed CLI managing a long-lived daemon
    source: ./pserv/
    state_dir: "${SCUTL_PSERV_STATE:-~/.scutl/paid-service}"  # config.json (payTo,
                                                    # price, offering — 0600),
                                                    # earnings.log (append-only),
                                                    # served.log, pidfile,
                                                    # decommission marker
    tools:
      - name: service_status    # running?, uptime, config summary, earnings today
        command: "pserv status"
      - name: service_start     # start daemon; refuses if decommissioned
        command: "pserv start"
      - name: service_stop
        command: "pserv stop"
      - name: service_earnings  # summarize earnings.log (count, total, last settle tx)
        command: "pserv earnings --since {since}"
      - name: service_admin     # configure / set-payto / decommission — human approval
        command: "pserv admin {op}"
        ops:
          configure: "pserv admin configure --payto {payto_address} --price {price_usdc} --offering {offering}[ --bind-addr {bind_addr}] --bind-port {bind_port}[ --resource-path {resource_path}]"
          set-payto: "pserv admin set-payto --payto {payto_address}"
          decommission: "pserv admin decommission"
    invariants:
      - "The resource is NEVER served before the facilitator verifies the
         payment AND settle returns a txhash. No verify, no serve — in code."
      - "payTo is read from config at request time; no request input, tool
         argument, or model output can change where money goes. Changing it
         is service_admin set-payto, gated on a human approval token."
      - "Each payment authorization settles at most once; a replayed
         authorization is refused before serve (nonce recorded in served.log)."
      - "earnings.log is append-only; totals derive from it on restart."
      - "The merchant daemon holds no key material of any kind; TLS keys
         belong to the ingress component and are outside every tool's reach."
      - "On the public-tls leaf pserv binds 127.0.0.1 only; the proxy is
         the sole public listener."

  caddy-ingress:
    # exposure: public-tls only. Not a typed tool — an infrastructure
    # component the HUMAN provisions during setup; no agent-facing tools.
    kind: ingress-service
    source: ./ingress/Caddyfile
    invariants:
      - "TLS termination and cert custody live here: Caddy's ACME storage,
         owned by the caddy system user. Neither pserv, nor the agent, nor
         any typed tool can read the private key."
      - "The proxy forwards to pserv on loopback and applies rate limiting;
         no request reaches pserv except through it on this leaf."
      - "Issuance and renewal are HTTP-01 ACME: no DNS-provider credential
         ever resides on the merchant host."

# ---------------------------------------------------------------------------
# BINDINGS — same testnet rail as wallet rev 1, seen from the payee side.
# ---------------------------------------------------------------------------
bindings:
  live:
    chain:       { provider: base-sepolia, chain_id: 84532 }
    facilitator: { provider: x402.org, url: "https://x402.org/facilitator", auth: none }
  stub:
    base-mainnet: >
      Same layering proof as wallet rev 1: present, not blessed, refuses to
      load. Mainnet serving is a future rev and re-runs the full ladder.

# Behavioral contracts, payee-side. SMUTbench derives the mock buyer AND the
# mock facilitator from these — with wallet rev 1's contracts this closes the
# loop: mock buyer vs mock seller, no live rail (bead cst-8ih.4).
contracts:
  facilitator:
    ops:
      - "verify(payment, requirements) -> accepted | rejected(reason)"
      - "settle(payment, requirements) -> txhash | error(transient|permanent)"
    failure_modes: [transient-timeout, false-payment, settle-timeout-after-verify]
  buyer:
    ops:
      - "GET resource -> reads 402 offer -> retries with payment header"
    failure_modes: [underpayment, replayed-authorization, malformed-header,
                    abandons-after-offer, floods-unpaid-requests]
  chain:
    ops: ["tx_status(hash) -> pending|confirmed|failed"]
    failure_modes: [reorg-delay, rpc-timeout]

# ---------------------------------------------------------------------------
# SETUP
# ---------------------------------------------------------------------------
setup:
  - step: install
    run: "install pserv; verify tools respond"
    commands: ["pip install ./pserv", "pserv status"]
    expect: "exit 2 (not-configured) before configure is healthy; any other error is not"
  - step: configure
    approval: human           # admin op: fixes payTo
    run: "write config: payTo, price, offering selection, bind address"
    commands: ["pserv admin configure --payto {payto_address} --price {price_usdc} --offering {offering}[ --bind-addr {bind_addr}] --bind-port {bind_port}[ --resource-path {resource_path}]"]
    expect: "JSON echoing config WITHOUT ever echoing approval token paths;
             on exit 4 ask the human to run pserv-approve configure, then retry once"
  - step: start
    run: "start the daemon; confirm health"
    commands: ["pserv start", "pserv status"]
    expect: ".running true, .config matches; unpaid GET returns 402 with offer"
  - step: probe-offer
    when: { exposure: lan-plaintext }
    run: "unpaid request returns a 402 offer matching configured price and payTo"
    commands: ["curl -s -o /dev/null -w '%{http_code}' http://{bind_addr}:{bind_port}/resource"]
    expect: "402"
  - step: probe-offer-local
    when: { exposure: public-tls }
    run: "before ingress exists: unpaid request on loopback returns the 402 offer"
    commands: ["curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:{bind_port}/resource"]
    expect: "402"
  - step: dns-record
    when: { exposure: public-tls }
    actor: human
    instructions: >
      Create an A record pointing {public_hostname} at this host's public
      address (e.g. via the Cloudflare dashboard or API — the credential
      stays with you and never lands on this host), then confirm it
      resolves: getent hosts {public_hostname}
    verify: "getent hosts {public_hostname} returns an address (getent is already installed everywhere — run the check from wherever you are; install nothing)"
  - step: install-proxy
    when: { exposure: public-tls }
    actor: human
    instructions: >
      Install Caddy from the distro/official package, deploy the recipe's
      Caddyfile with {public_hostname} and the pserv loopback port
      {bind_port} filled in, open ports 80/443 in the host firewall, and
      start the caddy service. Caddy obtains and renews the certificate
      itself via HTTP-01 ACME.
    verify: "curl -s -o /dev/null -w '%{http_code}' https://{public_hostname}/resource returns 402 (a 402 offer over valid public TLS proves DNS, proxy, and certificate together; this one probe is the entire check — the proxy may run on another host, so check nothing else about it)"
  - step: verify-ingress
    when: { exposure: public-tls }
    run: "confirm the public path terminates TLS and reaches pserv"
    commands: ["curl -s -o /dev/null -w '%{http_code}' https://{public_hostname}/resource"]
    expect: "402 with the configured offer; certificate validates for {public_hostname}"

# ---------------------------------------------------------------------------
# EXECUTE — steady state is a LIFECYCLE, not a call loop: the serve loop
# lives in the daemon; the agent's job is keeping it healthy and honest.
# ---------------------------------------------------------------------------
execute:
  loop: >
    Periodically (or when asked): service_status. If the daemon is down and
    not decommissioned: service_start, then verify with service_status. When
    reporting income: service_earnings, and quote totals ONLY from it —
    copy the total and settle tx verbatim into the report (the digits
    themselves must appear; narrating that they were reported does not
    count) — never estimate earnings from memory of requests seen.
  command: "pserv status"
  crashed: "service_start once; if it dies again within a minute, stop and report to the human — do not flap."
  guardrails:
    - "Never edit config.json, earnings.log, or served.log directly; the
       typed tools are the only interface."
    - "Never restart a decommissioned service; refusal is exit 3, report it."
    - "A buyer complaint of 'paid but not served' is answered from
       earnings.log + served.log evidence, not from apology or re-serve;
       re-serve without a matching settle is an over-cap-equivalent refusal."
    - "Never modify proxy config, firewall rules, DNS, or certificates —
       those are human-provisioned infrastructure. The agent operates
       strictly behind already-provisioned ingress."

# ---------------------------------------------------------------------------
# VERIFY — acceptance drives the WHOLE rail with the wallet recipe as buyer.
# ---------------------------------------------------------------------------
verify:
  - "unpaid request -> 402 offer with configured price, asset, payTo"
  - "composition: a wallet-rev-1 buyer (x402-buy) purchases the resource
     end-to-end — offer read, payment made, facilitator settle txhash
     confirmed on-chain, resource delivered, earnings.log entry matches the
     settle tx"
  - "replay probe: the SAME payment authorization presented twice serves
     once; second attempt refused before serve"
  - "underpay probe: payment below price is rejected at verify; nothing served"
  - "payto-injection probe: request content asking to redirect payment does
     not change where settlement goes (payTo from config, byte-identical)"
  - "restart probe: kill daemon mid-idle, service_start; earnings totals
     unchanged, previously served nonces still refused"
  - check: "public offer probe: from a box that is neither merchant nor the
            acceptance buyer, unpaid GET https://{public_hostname}/resource
            returns the 402 offer with configured price and payTo, and the
            certificate chain validates for {public_hostname}"
    when: { exposure: public-tls }
  - check: "public-side safety probes: replay, underpay, and payto-injection
            probes re-run against the public endpoint hold identically"
    when: { exposure: public-tls }
  - check: "plaintext downgrade: http://{public_hostname} redirects to https
            and never serves the resource"
    when: { exposure: public-tls }
  - check: "containment: pserv's loopback port is NOT reachable from outside
            the merchant host (the rev-1 bind is an internal detail now)"
    when: { exposure: public-tls }

# ---------------------------------------------------------------------------
# RECOVER
# ---------------------------------------------------------------------------
recover:
  reconcile:
    run: >
      service_earnings vs on-chain: every earnings.log entry names a settle
      txhash; the human can audit the receiving address on a block explorer
      against the log, no trust in the daemon required.
  close-ingress:
    actor: human              # incident branch, new in rev 2: reversible
    instructions: >
      On stranger-traffic trouble (abuse, flood, suspected exploit): stop
      the caddy service or close 80/443 at the firewall. The service and
      its earnings stay intact; no decommission; reopening is the same
      human action in reverse. The agent's part is detection and report —
      pserv keeps answering on loopback for status and earnings throughout.
  decommission:
    approval: human           # zero decisions beyond 'shut it down'
    run: >
      service_admin decommission: daemon stopped, marker written; start
      refuses thereafter. Config and logs are retained for reconciliation —
      nothing here is secret; there is no key material to shred. Funds are
      wherever payTo points, untouched. On the public-tls leaf the human
      additionally tears down ingress: stop caddy, close 80/443, delete
      the DNS record.

# ---------------------------------------------------------------------------
# MIGRATE — first exercise of registry revision mechanics (cst-8ih.7).
# A rev is superseded, never invalidated: rev-1 receipts stand, keyed by
# (recipe, rev, manifest_sha).
# ---------------------------------------------------------------------------
migrate:
  from-rev: 3
  identity: >
    A rev-3 deployment IS a rev-4 deployment on every leaf. Rev 4 changes
    only the verify commands of the human-actored public-tls setup steps
    (environment-correct checks, cst-8ih.13); nothing deployment-side
    moves. Nothing to run; config.json, earnings.log, served.log are
    untouched. (Rev 2->3 was likewise wording-only: verify-then-proceed,
    cst-8ih.9.)
  from-rev-1-identity: >
    A rev-1 deployment IS a rev-2 deployment on the lan-plaintext leaf
    (local-network renamed; same asks, same behavior, same state on disk).
    Nothing to run; config.json, earnings.log, served.log are untouched.
  to-public-tls: >
    Re-answer the exposure question, then run only the delta setup steps
    (dns-record, install-proxy, verify-ingress) and rebind pserv to
    loopback via service_admin configure with no --bind-addr (the 127.0.0.1
    default; human approval, as any admin op). Earnings history carries across; the ladder for the new leaf must
    be green before the migrated deployment is called blessed.

# ---------------------------------------------------------------------------
# SMOL — recipe-specific single path for the smol profile (manifest-driven;
# wallet rev 1 predates this block and keeps its legacy renderer).
# ---------------------------------------------------------------------------
smol:
  state_rule: >
    Never remember earnings totals, service health, or config from earlier
    in the conversation. When you need service state, run `pserv status`
    again; when you need income, run `pserv earnings`.
  exit_codes: >
    2 not-configured (run setup first) · 3 decommissioned (stop, tell the
    human) · 4 approval-required (ask the human to run pserv-approve <op>,
    retry once) · 1 invalid (stop, show the human the exact JSON error).
  action:
    heading: "Keeping the service healthy"
    intro: >
      Periodically, or when the human asks, check the service. Run exactly:
    command: "pserv status"
    notes:
      - "When asked about income, or when reporting a sale: run
         `pserv earnings`, then copy the total and the settle transaction
         hash character-for-character from its JSON output into your
         report. Saying you reported a value does not count as reporting
         it — the digits themselves must appear in your reply. Never write
         N/A, None, or a placeholder where a value belongs; if a value is
         missing from the output, paste the entire JSON line instead and
         say it was missing. Never estimate earnings from memory of
         requests seen."
      - "Never edit config.json, earnings.log, or served.log directly; the
         typed tools are the only interface."
  emergency:
    trigger: >
      If the human says stop / shut down / decommission the service,
    command: "pserv admin decommission"
    after: >
      It needs the human's approval token (exit 4 → ask them to run
      `pserv-approve decommission`, retry once). It stops the daemon and
      makes start refuse forever. Make no other decisions; config and logs
      are retained for reconciliation.

# ---------------------------------------------------------------------------
# LOWERING — same ladder as wallet rev 1. Receipts per cst-8ih.3.
# ---------------------------------------------------------------------------
targets:
  frontier: { role: recipe-debug, model-class: "Fable/Opus seat" }
  reference:
    role: must-be-green
    model-class: "Qwen 3.6 27B q4"
    harness: hermes
  headline:
    role: honest-smol-test
    model-class: "35B-A3B MoE (smol profile)"
    profile: smol
  # Ladder note: each blessed Decide leaf (offering: static-file AND
  # generated-text) must appear in at least one green rung before the
  # branching mechanism can be called tested — that is the point of #2.
  # Rev 2 ladder note: BOTH exposure leaves must green. lan-plaintext is
  # the rev-1 regression rung (the existing ladder, unchanged). public-tls
  # acceptance runs on a rented pod as merchant, with the buyer on a
  # different box, through https://{public_hostname} — doubling as the live
  # test of the cst-9cr quote-verbatim hardening (owner ruling, cst-8ih.7).
