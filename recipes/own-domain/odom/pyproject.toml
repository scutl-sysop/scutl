[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scutl-odom"
version = "0.1.0"
description = "scutl own-domain recipe rev 1: buy and hold a domain the agent owns (Porkbun card rail) under code-enforced walls"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
odom = "scutl_odom.cli:main"
odom-approve = "scutl_odom.cli:approve"

[tool.setuptools.packages.find]
include = ["scutl_odom*"]
