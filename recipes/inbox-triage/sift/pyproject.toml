[project]
name = "scutl-sift"
version = "0.1.0"
description = "scutl recipe component: inbox-triage (summarize, categorize, draft-never-send)"
requires-python = ">=3.10"

[project.scripts]
sift = "scutl_sift.cli:main"
sift-approve = "scutl_sift.cli:approve_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scutl_sift*"]
