[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scutl-beacon"
version = "0.1.0"
description = "scutl uptime-monitoring recipe rev 1: services watched from both failure domains — a fire on the far hill, tested while it matters"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
beacon = "scutl_beacon.cli:main"
beacon-approve = "scutl_beacon.cli:approve"

[tool.setuptools.packages.find]
include = ["scutl_beacon*"]
