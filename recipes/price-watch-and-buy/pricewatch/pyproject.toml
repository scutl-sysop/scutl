[project]
name = "scutl-pwatch"
version = "0.1.0"
description = "scutl recipe component: price-watch-and-buy (hold a target price and buy under caps vs an adversarial merchant)"
requires-python = ">=3.10"

[project.scripts]
pricewatch = "scutl_pwatch.cli:main"
pricewatch-approve = "scutl_pwatch.cli:approve_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scutl_pwatch*"]
