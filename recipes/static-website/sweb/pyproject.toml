[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scutl-sweb"
version = "0.1.0"
description = "scutl static-website recipe rev 1: publish a site the agent owns (Vultr object storage) under code-enforced walls"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sweb = "scutl_sweb.cli:main"
sweb-approve = "scutl_sweb.cli:approve"

[tool.setuptools.packages.find]
include = ["scutl_sweb*"]
